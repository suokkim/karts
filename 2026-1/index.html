<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026-1 · 스튜디오F 아카이브</title>
<style>
:root{--bg:#faf9f7;--fg:#1a1a19;--muted:#6b6a66;--line:#e2e0db;--card:#fff;--accent:#2f6f4f}
@media(prefers-color-scheme:dark){:root{--bg:#131311;--fg:#eceae5;--muted:#9a978f;--line:#2b2a27;--card:#1b1b19;--accent:#7fc0a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
a{color:inherit;text-decoration:none}
header{padding:clamp(3rem,8vw,6rem) 1.5rem 2.5rem;border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto}
h1{margin:0;font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:.5rem}
main{padding:2.5rem 1.5rem 6rem}
.years{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  display:block;transition:transform .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .thumb{aspect-ratio:4/3;background:var(--line) center/cover no-repeat;display:block}
.card .meta{padding:.75rem .9rem}
.card .meta b{font-size:1.15rem;letter-spacing:-.01em}
.card .meta span{display:block;color:var(--muted);font-size:.85rem;margin-top:.15rem}
h2{margin:3rem 0 .25rem;font-size:1.25rem;letter-spacing:-.01em}
h2:first-of-type{margin-top:.5rem}
.path{color:var(--muted);font-size:.85rem;margin-bottom:.9rem}
.grid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block;
  aspect-ratio:1;background:var(--line);border-radius:8px;cursor:zoom-in}
.tile{position:relative;display:block;aspect-ratio:1}
.tile video{cursor:pointer}
.badge{position:absolute;left:.45rem;bottom:.45rem;pointer-events:none;
  display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .5rem;border-radius:999px;
  background:rgba(0,0,0,.66);color:#fff;font-size:.72rem;line-height:1;
  backdrop-filter:blur(2px)}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.28) 0 34px,transparent 34px)}
.tile .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:1.6rem;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.doc{display:flex;align-items:center;gap:.5rem;padding:.9rem;border:1px dashed var(--line);border-radius:8px}
.back{display:inline-block;margin-bottom:1rem;color:var(--muted);font-size:.9rem}
.back:hover{color:var(--accent)}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}
dialog::backdrop{background:rgba(0,0,0,.88)}
dialog img,dialog video{max-width:96vw;max-height:92vh;display:block;margin:auto;border-radius:6px}
dialog .cap{color:#ddd;text-align:center;font-size:.85rem;padding:.5rem}
footer{border-top:1px solid var(--line);padding:2rem 1.5rem;color:var(--muted);font-size:.85rem}
</style></head><body><header><div class="wrap"><a class="back" href="../index.html">← 전체 학기</a><h1>2026-1</h1><div class="sub">한국예술종합학교 연극원 무대미술과 · 멀티미디어</div></div></header><main><div class="wrap"><h2>배연재</h2><div class="grid"><img loading="lazy" src="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch03.jpg" alt="sketch03" data-full="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch03.jpg" data-name="sketch03"><img loading="lazy" src="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch04.jpg" alt="sketch04" data-full="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch04.jpg" data-name="sketch04"><img loading="lazy" src="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch05.jpg" alt="sketch05" data-full="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch05.jpg" data-name="sketch05"><img loading="lazy" src="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch06.jpg" alt="sketch06" data-full="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch06.jpg" data-name="sketch06"><img loading="lazy" src="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch07.jpg" alt="sketch07" data-full="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch07.jpg" data-name="sketch07"><img loading="lazy" src="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch08.jpg" alt="sketch08" data-full="%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch08.jpg" data-name="sketch08"></div><h2>전진</h2><div class="grid"><span class="tile"><video preload="metadata" src="%EC%A0%84%EC%A7%84/%EB%8F%99%EC%98%81%EC%83%81_1.mp4#t=0.5" muted data-full="%EC%A0%84%EC%A7%84/%EB%8F%99%EC%98%81%EC%83%81_1.mp4" data-kind="video" data-name="동영상_1"></video><span class="play">▶</span><span class="badge">영상</span></span><span class="tile"><video preload="metadata" src="%EC%A0%84%EC%A7%84/%EB%8F%99%EC%98%81%EC%83%81_2.mp4#t=0.5" muted data-full="%EC%A0%84%EC%A7%84/%EB%8F%99%EC%98%81%EC%83%81_2.mp4" data-kind="video" data-name="동영상_2"></video><span class="play">▶</span><span class="badge">영상</span></span><span class="tile"><video preload="metadata" src="%EC%A0%84%EC%A7%84/%EB%8F%99%EC%98%81%EC%83%81_3.mp4#t=0.5" muted data-full="%EC%A0%84%EC%A7%84/%EB%8F%99%EC%98%81%EC%83%81_3.mp4" data-kind="video" data-name="동영상_3"></video><span class="play">▶</span><span class="badge">영상</span></span><span class="tile"><video preload="metadata" src="%EC%A0%84%EC%A7%84/%EB%8F%99%EC%98%81%EC%83%81_4.mp4#t=0.5" muted data-full="%EC%A0%84%EC%A7%84/%EB%8F%99%EC%98%81%EC%83%81_4.mp4" data-kind="video" data-name="동영상_4"></video><span class="play">▶</span><span class="badge">영상</span></span></div></div></main>
<footer><div class="wrap">노션 아카이브에서 생성 · 이미지 WebP / 영상 H.264 로 경량화</div></footer>

<dialog id="lb"><div id="lbbody"></div><div class="cap" id="lbcap"></div></dialog>
<script>
const lb=document.getElementById('lb'),body=document.getElementById('lbbody'),cap=document.getElementById('lbcap');
document.querySelectorAll('[data-full]').forEach(el=>el.addEventListener('click',()=>{
  const src=el.dataset.full, isVid=el.dataset.kind==='video';
  body.innerHTML = isVid
    ? '<video controls autoplay playsinline src="'+src+'"></video>'
    : '<img src="'+src+'" alt="">';
  cap.textContent = el.dataset.name || '';
  lb.showModal();
}));
lb.addEventListener('click',e=>{if(e.target===lb) lb.close()});
lb.addEventListener('close',()=>{body.innerHTML=''});
</script>
</body></html>
