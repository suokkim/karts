<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2021-1 · 스튜디오F 아카이브</title>
<style>
:root{--bg:#faf9f7;--fg:#1a1a19;--muted:#6b6a66;--line:#e2e0db;--card:#fff;--accent:#2f6f4f}
@media(prefers-color-scheme:dark){:root{--bg:#131311;--fg:#eceae5;--muted:#9a978f;--line:#2b2a27;--card:#1b1b19;--accent:#7fc0a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
a{color:inherit;text-decoration:none}
header{padding:clamp(2rem,5vw,3.5rem) 1.5rem 1.5rem;border-bottom:1px solid var(--line)}
.wrap{max-width:1400px;margin:0 auto}
h1{margin:0;font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:.5rem}
main{padding:1.75rem 1.5rem 5rem}
.years{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
/* 학기 카드: 이름을 아래 상자에 따로 두지 않고 썸네일 위에 얹는다 */
.card{position:relative;border-radius:12px;overflow:hidden;display:block;
  transition:transform .15s ease}
.card:hover{transform:translateY(-2px)}
.card .thumb{aspect-ratio:4/3;background:var(--line) center/cover no-repeat;display:block}
.card .meta{position:absolute;inset:auto 0 0 0;padding:1.6rem .8rem .6rem;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.72))}
.card .meta b{font-size:1.15rem;letter-spacing:-.01em}
.card .meta span{display:block;font-size:.8rem;opacity:.8;margin-top:.1rem}
h2{margin:2rem 0 .2rem;font-size:1.1rem;letter-spacing:-.01em}
h2:first-of-type{margin-top:.25rem}
.path{color:var(--muted);font-size:.85rem;margin-bottom:.9rem}
/* 한 사람 작업을 한 그룹으로 묶으면서 한 그룹에 100장 넘는 경우가 생겼다.
   타일을 작게 잡아 한 화면에 많이 들어오게 한다 (자세히 볼 땐 라이트박스). */
.grid{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block;
  aspect-ratio:1;background:var(--line);border-radius:8px;cursor:zoom-in}
.tile{position:relative;display:block;aspect-ratio:1}
.tile video{cursor:pointer}
.badge{position:absolute;left:.45rem;bottom:.45rem;pointer-events:none;
  display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .5rem;border-radius:999px;
  background:rgba(0,0,0,.66);color:#fff;font-size:.72rem;line-height:1;
  backdrop-filter:blur(2px)}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.28) 0 34px,transparent 34px)}
.tile .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:1.6rem;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.doc{display:flex;align-items:center;gap:.5rem;padding:.9rem;border:1px dashed var(--line);border-radius:8px}
.back{display:inline-block;margin-bottom:1rem;color:var(--muted);font-size:.9rem}
.back:hover{color:var(--accent)}
/* ── 확대 보기 ─────────────────────────────────────────────────────────
   <dialog> 를 쓰지 않는다 — 톱레이어·백드롭은 iOS 에서 동작이 들쭉날쭉하다.
   평범한 fixed div + 직접 스크롤 잠금이 훨씬 예측 가능하다. */
html.locked{overflow:hidden}          /* 뒤 페이지가 같이 스크롤되던 문제 */
#lb{position:fixed;inset:0;z-index:10;display:none;background:rgba(0,0,0,.94);
  touch-action:none;overscroll-behavior:contain;user-select:none}
#lb.open{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage img,#stage video{max-width:100vw;max-height:100dvh;width:auto;height:auto;
  display:block;will-change:transform;-webkit-user-drag:none}
/* 손을 뗐을 때만 애니메이션 — 끄는 동안은 손가락을 그대로 따라가야 한다 */
#stage.anim img,#stage.anim video{transition:transform .34s cubic-bezier(.22,1,.36,1),
  opacity .34s cubic-bezier(.22,1,.36,1)}
/* 위치 표시: 장수가 적으면 점, 많으면 막대 + 숫자 */
#ind{position:absolute;left:0;right:0;bottom:max(1rem,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:.45rem;
  pointer-events:none;color:#fff}
#dots{display:flex;gap:6px}
#dots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.3}
#dots i.on{opacity:.95}
#bar{width:min(200px,44vw);height:2px;border-radius:2px;background:rgba(255,255,255,.25)}
#bar b{display:block;height:100%;border-radius:2px;background:#fff;opacity:.9}
#num{font-size:.72rem;letter-spacing:.1em;opacity:.7}
footer{border-top:1px solid var(--line);padding:2rem 1.5rem;color:var(--muted);font-size:.85rem}
</style></head><body><header><div class="wrap"><a class="back" href="../index.html">← 전체 학기</a><h1>2021-1</h1><div class="sub">한국예술종합학교 연극원 무대미술과 · 멀티미디어</div></div></header><main><div class="wrap"><h2>이미지</h2><div class="path">2021-1</div><div class="grid"><img loading="lazy" src="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80/image_%2810%29.jpg" alt="image_(10)" data-full="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80/image_%2810%29.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80/image_%285%29.jpg" alt="image_(5)" data-full="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80/image_%285%29.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%206a3e-81ef/rear_window_10.jpg" alt="rear_window_10" data-full="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%206a3e-81ef/rear_window_10.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%206a3e-81ef/rear_window_11.jpg" alt="rear_window_11" data-full="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%206a3e-81ef/rear_window_11.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%207a75-8803/Rear_window_night.jpg" alt="Rear_window_night" data-full="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%207a75-8803/Rear_window_night.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%20c52c-c2ca/Rear_window_day.jpg" alt="Rear_window_day" data-full="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%20c52c-c2ca/Rear_window_day.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%20c52c-c2ca/image_%2811%29.jpg" alt="image_(11)" data-full="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%20c52c-c2ca/image_%2811%29.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%20c52c-c2ca/image_%2812%29.jpg" alt="image_(12)" data-full="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%20c52c-c2ca/image_%2812%29.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%20c52c-c2ca/image_%2813%29.jpg" alt="image_(13)" data-full="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%20c52c-c2ca/image_%2813%29.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%20c52c-c2ca/image_%2814%29.jpg" alt="image_(14)" data-full="2021-1/%EC%9D%B4%EB%AF%B8%EC%A7%80%20c52c-c2ca/image_%2814%29.jpg"></div><h2>김민정</h2><div class="grid"><img loading="lazy" src="2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image.jpg" alt="image" data-full="2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image.jpg"><img loading="lazy" src="2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image_%281%29.jpg" alt="image_(1)" data-full="2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image_%281%29.jpg"><img loading="lazy" src="2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image_%282%29.jpg" alt="image_(2)" data-full="2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image_%282%29.jpg"><img loading="lazy" src="2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image_%283%29.jpg" alt="image_(3)" data-full="2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image_%283%29.jpg"><img loading="lazy" src="2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image_%287%29.jpg" alt="image_(7)" data-full="2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image_%287%29.jpg"></div><h2>안연수</h2><div class="grid"><img loading="lazy" src="2021-1/%EC%95%88%EC%97%B0%EC%88%98/Untitled.jpg" alt="Untitled" data-full="2021-1/%EC%95%88%EC%97%B0%EC%88%98/Untitled.jpg"><img loading="lazy" src="2021-1/%EC%95%88%EC%97%B0%EC%88%98/image.jpg" alt="image" data-full="2021-1/%EC%95%88%EC%97%B0%EC%88%98/image.jpg"><img loading="lazy" src="2021-1/%EC%95%88%EC%97%B0%EC%88%98/image_%283%29.jpg" alt="image_(3)" data-full="2021-1/%EC%95%88%EC%97%B0%EC%88%98/image_%283%29.jpg"><img loading="lazy" src="2021-1/%EC%95%88%EC%97%B0%EC%88%98/image_%284%29.jpg" alt="image_(4)" data-full="2021-1/%EC%95%88%EC%97%B0%EC%88%98/image_%284%29.jpg"><img loading="lazy" src="2021-1/%EC%95%88%EC%97%B0%EC%88%98/image_%285%29.jpg" alt="image_(5)" data-full="2021-1/%EC%95%88%EC%97%B0%EC%88%98/image_%285%29.jpg"></div><h2>이태양</h2><div class="grid"><img loading="lazy" src="2021-1/%EC%9D%B4%ED%83%9C%EC%96%91/image_%288%29.jpg" alt="image_(8)" data-full="2021-1/%EC%9D%B4%ED%83%9C%EC%96%91/image_%288%29.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%ED%83%9C%EC%96%91%20bd0e-3146/image_%284%29.jpg" alt="image_(4)" data-full="2021-1/%EC%9D%B4%ED%83%9C%EC%96%91%20bd0e-3146/image_%284%29.jpg"><img loading="lazy" src="2021-1/%EC%9D%B4%ED%83%9C%EC%96%91%20e9fa-4598/image_%286%29.jpg" alt="image_(6)" data-full="2021-1/%EC%9D%B4%ED%83%9C%EC%96%91%20e9fa-4598/image_%286%29.jpg"></div></div></main>
<footer><div class="wrap">노션 아카이브에서 생성 · 이미지 JPEG 장변 1600px / 영상 H.264 장변 1280px</div></footer>

<div id="lb" role="dialog" aria-modal="true" aria-label="확대 보기">
  <div id="stage"></div>
  <div id="ind"><div id="dots"></div><div id="bar"><b></b></div><div id="num"></div></div>
</div>
<script>
const lb=document.getElementById('lb'), stage=document.getElementById('stage');
const dots=document.getElementById('dots'), bar=document.getElementById('bar'),
      barFill=bar.firstElementChild, num=document.getElementById('num');

// 화면에 그려진 순서 그대로. 한 장씩만 들고 있으므로 인덱스가 어긋날 수 없다 —
// 예전에 3장 페이저로 만들었다가 '누른 것과 다른 그림'이 열려서 이 구조로 왔다.
const items=[...document.querySelectorAll('[data-full]')].map(el=>(
  {src:el.dataset.full, vid:el.dataset.kind==='video'}));
const n=items.length;
const DOT_MAX=15;                      // 이보다 많으면 점 대신 막대+숫자
let idx=0, busy=false;

function render(i){
  const it=items[i];
  stage.innerHTML = it.vid
    ? '<video controls playsinline preload="metadata" src="'+it.src+'"></video>'
    : '<img src="'+it.src+'" alt="">';
}
function paintInd(){
  num.textContent=(idx+1)+' / '+n;
  if(n<=DOT_MAX){
    bar.style.display='none';
    dots.innerHTML=items.map((_,k)=>'<i'+(k===idx?' class="on"':'')+'></i>').join('');
  } else {
    dots.innerHTML='';
    bar.style.display='';
    barFill.style.width=((idx+1)/n*100).toFixed(2)+'%';
  }
}
// 이웃을 미리 받아둔다 — 넘길 때 흰 화면이 안 보이게
function preload(){
  [idx+1, idx-1].forEach(k=>{
    const it=items[(k+n)%n];
    if(!it.vid) new Image().src=it.src;
  });
}

let pageY=0;
const lock=()=>{ pageY=scrollY; document.documentElement.classList.add('locked'); };
const unlock=()=>{ document.documentElement.classList.remove('locked'); scrollTo(0,pageY); };
const isOpen=()=>lb.classList.contains('open');

function openAt(i){
  idx=i; render(idx); paintInd(); lock();
  lb.classList.add('open');
  preload();
}
function close(){
  const m=stage.firstElementChild;
  if(m && m.tagName==='VIDEO') m.pause();
  lb.classList.remove('open'); stage.innerHTML=''; unlock();
}
document.querySelectorAll('[data-full]').forEach((el,i)=>
  el.addEventListener('click',()=>openAt(i)));

// 넘김: 지금 장을 밀어내고, 다음 장을 반대편에서 들여온다.
// 이미지는 디코드를 기다렸다 바꾸므로 전환 중에 빈 칸이 보이지 않는다.
async function go(dir){
  if(busy || n<2) return;
  busy=true;
  const out=stage.firstElementChild;
  stage.classList.add('anim');
  out.style.transform='translateY('+(-dir*60)+'vh)';
  out.style.opacity='0';
  const next=(idx+dir+n)%n, it=items[next];
  if(!it.vid){ const pre=new Image(); pre.src=it.src; try{ await pre.decode(); }catch{} }
  await new Promise(r=>setTimeout(r,180));
  idx=next; render(idx); paintInd();
  const inEl=stage.firstElementChild;
  stage.classList.remove('anim');
  inEl.style.transform='translateY('+(dir*60)+'vh)';
  inEl.style.opacity='0';
  inEl.getBoundingClientRect();          // 위치를 확정해야 다음 transition 이 먹는다
  stage.classList.add('anim');
  inEl.style.transform=''; inEl.style.opacity='1';
  setTimeout(()=>{ busy=false; preload(); },360);
}
function spring(){                        // 문턱을 못 넘었을 때 제자리로
  const m=stage.firstElementChild; if(!m) return;
  stage.classList.add('anim');
  m.style.transform=''; m.style.opacity='1';
}

// 손가락을 그대로 따라가고, 뗄 때 넘김/복귀를 정한다
const THRESH=()=>Math.min(110, innerHeight*.15);
let y0=null, dy=0, drag=false;
lb.addEventListener('touchstart',e=>{
  if(busy || e.touches.length>1){ y0=null; return; }
  y0=e.touches[0].clientY; dy=0; drag=false;
  stage.classList.remove('anim');
},{passive:true});
lb.addEventListener('touchmove',e=>{
  if(y0===null) return;
  dy=e.touches[0].clientY-y0;
  if(!drag && Math.abs(dy)>6) drag=true;   // 탭과 섞이지 않게 6px 문턱
  if(!drag) return;
  e.preventDefault();
  const m=stage.firstElementChild; if(!m) return;
  m.style.transform='translateY('+dy+'px)';
  m.style.opacity=String(Math.max(.3, 1-Math.abs(dy)/innerHeight));
},{passive:false});
lb.addEventListener('touchend',()=>{
  if(y0===null) return;
  const d=dy, moved=drag; y0=null;
  if(!moved) return;                       // 탭은 click 이 처리
  if(Math.abs(d)>THRESH()) go(d<0?1:-1); else spring();
},{passive:true});
lb.addEventListener('touchcancel',()=>{ if(drag) spring(); y0=null; },{passive:true});

// 탭 = 닫기 (영상 컨트롤과 드래그 직후는 제외)
lb.addEventListener('click',e=>{
  if(drag){ drag=false; return; }
  if(e.target.tagName==='VIDEO') return;
  close();
});

// 데스크톱: 휠·키보드
let wheelLock=false, wheelT=0;
lb.addEventListener('wheel',e=>{
  e.preventDefault();
  clearTimeout(wheelT); wheelT=setTimeout(()=>{ wheelLock=false; },250);
  if(wheelLock || Math.abs(e.deltaY)<25) return;
  wheelLock=true; go(e.deltaY>0?1:-1);
},{passive:false});
addEventListener('keydown',e=>{
  if(!isOpen()) return;
  if(e.key==='Escape'){ close(); return; }
  const dir={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key];
  if(dir){ e.preventDefault(); go(dir); }
});
</script>
