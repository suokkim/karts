<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스튜디오F 아카이브</title>
<style>
:root{--bg:#faf9f7;--fg:#1a1a19;--muted:#6b6a66;--line:#e2e0db;--card:#fff;--accent:#2f6f4f}
@media(prefers-color-scheme:dark){:root{--bg:#131311;--fg:#eceae5;--muted:#9a978f;--line:#2b2a27;--card:#1b1b19;--accent:#7fc0a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
a{color:inherit;text-decoration:none}
header{padding:clamp(3rem,8vw,6rem) 1.5rem 2.5rem;border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto}
h1{margin:0;font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:.5rem}
main{padding:2.5rem 1.5rem 6rem}
.years{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  display:block;transition:transform .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .thumb{aspect-ratio:4/3;background:var(--line) center/cover no-repeat;display:block}
.card .meta{padding:.75rem .9rem}
.card .meta b{font-size:1.15rem;letter-spacing:-.01em}
.card .meta span{display:block;color:var(--muted);font-size:.85rem;margin-top:.15rem}
h2{margin:3rem 0 .25rem;font-size:1.25rem;letter-spacing:-.01em}
h2:first-of-type{margin-top:.5rem}
.path{color:var(--muted);font-size:.85rem;margin-bottom:.9rem}
.grid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block;
  aspect-ratio:1;background:var(--line);border-radius:8px;cursor:zoom-in}
.tile{position:relative;display:block;aspect-ratio:1}
.tile video{cursor:pointer}
.badge{position:absolute;left:.45rem;bottom:.45rem;pointer-events:none;
  display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .5rem;border-radius:999px;
  background:rgba(0,0,0,.66);color:#fff;font-size:.72rem;line-height:1;
  backdrop-filter:blur(2px)}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.28) 0 34px,transparent 34px)}
.tile .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:1.6rem;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.doc{display:flex;align-items:center;gap:.5rem;padding:.9rem;border:1px dashed var(--line);border-radius:8px}
.back{display:inline-block;margin-bottom:1rem;color:var(--muted);font-size:.9rem}
.back:hover{color:var(--accent)}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.88)}
dialog video{max-width:96vw;max-height:92vh;display:block;margin:auto;border-radius:6px}
/* 세로로 긴 문서·포스터는 높이로 맞추면 글씨가 안 보인다 → 폭에 맞추고 세로 스크롤 */
dialog img{max-width:96vw;display:block;margin:auto;border-radius:6px}
dialog img.fitheight{max-height:92vh;width:auto}
dialog .cap{color:#ddd;text-align:center;font-size:.85rem;padding:.5rem}
footer{border-top:1px solid var(--line);padding:2rem 1.5rem;color:var(--muted);font-size:.85rem}
</style></head><body><header><div class="wrap"><h1>스튜디오F 아카이브</h1><div class="sub">한국예술종합학교 연극원 무대미술과 · 멀티미디어 · 2018–2025 · 총 836점</div></div></header><main><div class="wrap"><div class="years"><a class="card" href="2026-1/index.html"><span class="thumb" style="background-image:url(2026-1/%EB%B0%B0%EC%97%B0%EC%9E%AC/sketch03.jpg)"></span><span class="meta"><b>2026-1</b><span>작품 10점</span></span></a><a class="card" href="2025-2/index.html"><span class="thumb" style="background-image:url(2025-2/%EA%B0%95%EC%86%8C%EB%9E%91/unnamed/unnamed.jpg)"></span><span class="meta"><b>2025-2</b><span>작품 78점</span></span></a><a class="card" href="2025-1/index.html"><span class="thumb" style="background-image:url(2025-1/%EB%B0%B0%EC%97%B0%EC%9E%AC/IMG_4409/IMG_4409.jpg)"></span><span class="meta"><b>2025-1</b><span>작품 62점</span></span></a><a class="card" href="2024-1/index.html"><span class="thumb" style="background-image:url(2024-1/KakaoTalk_20240626_232132086.jpg)"></span><span class="meta"><b>2024-1</b><span>작품 39점</span></span></a><a class="card" href="2023-2/index.html"><span class="thumb" style="background-image:url(2023-2/%EC%A0%9C%EB%AA%A9%20%EC%97%86%EC%9D%8C/%EB%B0%95%EC%88%98%ED%98%84/Hyperballad_Main_Cover.jpg)"></span><span class="meta"><b>2023-2</b><span>작품 63점</span></span></a><a class="card" href="2023-1/index.html"><span class="thumb" style="background-image:url(2023-1/2023-1%20%EC%8A%A4%ED%8A%9C%EB%94%94%EC%98%A4F/%EA%B9%80%EC%9E%AC%EB%9E%80/KakaoTalk_Photo_2023-06-20-00-01-11_001.jpg)"></span><span class="meta"><b>2023-1</b><span>작품 58점</span></span></a><a class="card" href="2022-2/index.html"><span class="thumb" style="background-image:url(2022-2/2022-2%20%EA%B8%B0%EB%A7%90%EC%A0%9C%EC%B6%9C/%EB%AC%B8%EC%B0%BD%ED%98%81/2022.11.09._%EB%AA%A8%EB%8D%B8%EB%A7%81-001.jpg)"></span><span class="meta"><b>2022-2</b><span>작품 96점</span></span></a><a class="card" href="2022-1/index.html"><span class="thumb" style="background-image:url(2022-1/2022-1/%EA%B9%80%EB%AF%BC%EC%A0%95-%EC%97%B0%EA%B7%B9%20%EC%A7%91/Untitled%201.jpg)"></span><span class="meta"><b>2022-1</b><span>작품 58점</span></span></a><a class="card" href="2021-2/index.html"><span class="thumb" style="background-image:url(2021-2/2021-2/%EA%B9%80%EB%AF%BC%EC%A0%95/Untitled%201.jpg)"></span><span class="meta"><b>2021-2</b><span>작품 54점</span></span></a><a class="card" href="2021-1/index.html"><span class="thumb" style="background-image:url(2021-1/2021-1/%EA%B9%80%EB%AF%BC%EC%A0%95/image.jpg)"></span><span class="meta"><b>2021-1</b><span>작품 23점</span></span></a><a class="card" href="2020-2/index.html"><span class="thumb" style="background-image:url(2020-2/2020-2/%EA%B9%80%EB%AF%BC%EC%A0%951.jpg)"></span><span class="meta"><b>2020-2</b><span>작품 71점</span></span></a><a class="card" href="2020-1/index.html"><span class="thumb" style="background-image:url(2020-1/2020-1/IMG_1528/IMG_1528.jpg)"></span><span class="meta"><b>2020-1</b><span>작품 127점</span></span></a><a class="card" href="2019-2/index.html"><span class="thumb" style="background-image:url(2019-2/2019-2/%EA%B9%80%EC%9E%AC%EB%9E%801/5A3C46A3-5BB2-4B0A-8365-5B29D02D2E18_1_105_c.jpg)"></span><span class="meta"><b>2019-2</b><span>작품 24점</span></span></a><a class="card" href="2019-1/index.html"><span class="thumb" style="background-image:url(2019-1/2019-1/%EA%B9%80%EC%9E%AC%EB%9E%801/IMG_1278.jpg)"></span><span class="meta"><b>2019-1</b><span>작품 51점</span></span></a><a class="card" href="2018-2/index.html"><span class="thumb" style="background-image:url(2018-2/2018-2/%EA%B9%80%EB%AF%BC%EC%9A%B01/256A2928.jpg)"></span><span class="meta"><b>2018-2</b><span>작품 22점</span></span></a></div></div></main>
<footer><div class="wrap">노션 아카이브에서 생성 · 이미지 JPEG 장변 1600px / 영상 H.264 장변 1280px</div></footer>

<dialog id="lb"><div id="lbbody"></div><div class="cap" id="lbcap"></div></dialog>
<script>
const lb=document.getElementById('lb'),body=document.getElementById('lbbody'),cap=document.getElementById('lbcap');
document.querySelectorAll('[data-full]').forEach(el=>el.addEventListener('click',()=>{
  const src=el.dataset.full, isVid=el.dataset.kind==='video';
  // 비율 2:1 이하 이미지는 화면 높이에 맞추고, 더 긴 것은 폭에 맞춰 스크롤하게 둔다
  body.innerHTML = isVid
    ? '<video controls autoplay playsinline src="'+src+'"></video>'
    : '<img class="'+(el.dataset.tall==='1'?'':'fitheight')+'" src="'+src+'" alt="">';
  cap.textContent = el.dataset.name || '';
  lb.showModal();
}));
lb.addEventListener('click',e=>{if(e.target===lb) lb.close()});
lb.addEventListener('close',()=>{body.innerHTML=''});
</script>
</body></html>
