<style>
:root { color-scheme: light; }
* { margin:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {

  background:#d9d9d9; color:#3d3833;
  padding:0 1.5rem 3rem;
  display:flex; flex-direction:column; min-height:100dvh;
}
a { color:inherit; text-decoration:none; }
.wrap { width:100%; max-width:1100px; margin:0 auto; }
/* 아이폰 햅틱용 숨은 스위치 — 탭 대상을 label 로 만들어 이걸 토글시킨다 */
#hap { position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none; }

/* 상단 고정, 배경 투명 — 로고와 학기 이름만 떠 있고 작품이 그 위를 지나간다 */
header { width:100%; max-width:1100px; margin:0 auto 1.5rem;
  display:flex; justify-content:space-between; align-items:center;
  position:sticky; top:0; padding:2.5rem 0 1rem; pointer-events:none; }
header a, header label { pointer-events:auto; }
#logoBtn { display:flex; cursor:pointer; }
.tag { font-family:"Helvetica Neue","Apple SD Gothic Neo",sans-serif; font-weight:300;
  font-size:.68rem; letter-spacing:.14em; color:#89837a; }

.intro { width:100%; max-width:1100px; margin:0 auto 2.5rem; }
h1 { font-weight:400; font-size:clamp(1.7rem,3.6vw,2.4rem); letter-spacing:-.02em; }
.intro .tag { margin-top:.5rem; }

/* 학기 카드 */
.years { width:100%; max-width:1100px; margin:0 auto;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:2rem; z-index:1; }
.card { position:relative; display:block; }
.card .thumb { aspect-ratio:4/3; display:block;
  background:#cfcfcf center/cover no-repeat;
  border-radius:14px; border-top-right-radius:0; }
.card .meta { position:absolute; left:0; right:0; bottom:0; padding:1.4rem .9rem .7rem;
  color:#fff; border-radius:0 0 14px 14px;
  background:linear-gradient(transparent,rgba(35,30,25,.6)); }
.card .meta b { font-weight:400; font-size:1.1rem; letter-spacing:.02em; }
.card .meta span { display:block; font-family:"Helvetica Neue",sans-serif; font-weight:300;
  font-size:.66rem; letter-spacing:.12em; opacity:.85; margin-top:.15rem; }

/* 작품 그리드 */
main { width:100%; }
h2 { font-weight:400; font-size:1.05rem; letter-spacing:.02em;
  max-width:1100px; margin:2.5rem auto .7rem; }
h2:first-of-type { margin-top:0; }
.path { max-width:1100px; margin:-.5rem auto .7rem;
  font-family:"Helvetica Neue",sans-serif; font-weight:300;
  font-size:.66rem; letter-spacing:.12em; color:#89837a; }
.grid { width:100%; max-width:1100px; margin:0 auto;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:1rem;
  z-index:1; }  /* 상단 고정 헤더 위로 지나가게 */
.cell { position:relative; display:block; }
.grid img, .grid video { width:100%; height:100%; display:block; aspect-ratio:1;
  object-fit:cover; background:#cfcfcf; cursor:zoom-in;
  border-radius:14px; border-top-right-radius:0; }
/* 영상은 첫 프레임만 보여 이미지와 구분이 안 된다 → 재생 표시를 얹는다 */
.cell .play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  color:#fff; font-size:1.5rem; pointer-events:none; text-shadow:0 1px 8px rgba(0,0,0,.55); }
.cell .badge { position:absolute; left:.5rem; bottom:.5rem; pointer-events:none;
  font-family:"Helvetica Neue",sans-serif; font-weight:300;
  font-size:.6rem; letter-spacing:.12em; color:#fff;
  padding:.18rem .45rem; border-radius:999px; background:rgba(35,30,25,.6); }

footer { width:100%; max-width:1100px; margin:auto auto 0; padding-top:4rem;
  text-align:right; font-family:"Helvetica Neue","Apple SD Gothic Neo",sans-serif;
  font-weight:300; font-size:.68rem; color:#ededed; letter-spacing:.14em; }

/* ── 확대 보기 ──────────────────────────────────────────────────────────
   <dialog> 를 쓰지 않는다. 톱레이어·백드롭은 iOS 에서 검증이 안 된 동작이라
   평범한 fixed div + 직접 스크롤 잠금으로 간다 (ceramic POLICY.md §8). */
html.locked { overflow:hidden; }
#viewer { position:fixed; inset:0; display:none; z-index:10;
  background:rgba(30,25,20,.85); overflow:hidden; overscroll-behavior:contain; }
#viewer.open { display:block; animation:fadeIn .32s ease; }
#viewer.open .pop { animation:rise .55s .05s cubic-bezier(.16,1,.3,1) backwards; }
@keyframes fadeIn { from { opacity:0; } }
@keyframes rise { from { transform:translateY(10px) scale(.985); } }
@media (prefers-reduced-motion: reduce) {
  #viewer.open, #viewer.open .pop { animation:none; }
}
/* 3장(이전·현재·다음)만 들고 transform 으로 넘기는 세로 페이저.
   스크롤 스냅은 iOS 에서 문제가 많아 쓰지 않는다 — 제스처는 전부 JS 가 처리. */
#track { display:flex; flex-direction:column; width:100%; height:100%;
  transform:translateY(-100%); touch-action:none; }
#track > div { flex:0 0 100%; display:flex; align-items:center; justify-content:center; }
#track img, #track video { max-width:92%; max-height:92%; display:block; cursor:zoom-out;
  border-radius:14px; border-top-right-radius:0;
  -webkit-user-drag:none; user-select:none; }

<label for="hap" id="viewer" role="dialog" aria-modal="true"><div id="track"></div></label>
<script>
const viewer=document.getElementById('viewer'), track=document.getElementById('track');
// 그리드에 그려진 순서 그대로 — 화면 순서와 스와이프 순서가 어긋날 수 없다
const items=[...document.querySelectorAll('[data-full]')].map(el=>(
  {src:el.dataset.full, vid:el.dataset.kind==='video', alt:el.getAttribute('alt')||''}));
const n=items.length;
let cur=0;

const slides=[0,1,2].map(()=>{ const d=document.createElement('div'); track.appendChild(d); return d; });
const mediaOf=j=>slides[j].firstElementChild;

function fill(slot,i){
  const it=items[i], el=slides[slot];
  const want=it.vid?'VIDEO':'IMG';
  if(el.firstElementChild?.tagName!==want || el.firstElementChild.dataset.src!==it.src){
    el.innerHTML = it.vid
      ? '<video controls playsinline preload="metadata"></video>'
      : '<img alt="">';
    const m=el.firstElementChild;
    m.dataset.src=it.src; m.src=it.src;
    if(!it.vid) m.alt=it.alt;
  }
}
function show(){
  if(!n) return;
  if(zoom>1) resetZoom(false);
  [(cur-1+n)%n, cur, (cur+1)%n].forEach((idx,j)=>fill(j,idx));
}

// 넘김 전환: 시작은 손가락 속도를 이어받고 끝은 길게 미끄러지며 안착
const EASE='transform .7s cubic-bezier(.22,1,.36,1)';
const FADE='filter .7s cubic-bezier(.22,1,.36,1)';
const DIM=.25;
const setFade=(vals,animate)=>{ [...track.children].forEach((d,j)=>{
  d.style.transition=animate?FADE:'none'; d.style.filter=`brightness(${vals[j]})`; }); };
const setY=(px,animate)=>{
  track.style.transition=animate?EASE:'none';
  track.style.transform=`translateY(calc(-100% + ${px}px))`;
  const p=Math.min(1,Math.abs(px)/innerHeight);
  setFade([px>0?1:DIM, 1-(1-DIM)*p, px<0?1:DIM], animate);
};

// 진행 중인 전환을 즉시 확정한다. 모든 입력이 이걸 먼저 부르므로 상태가 꼬여도
// 다음 입력이 반드시 초기화한다 — 잠김 플래그가 없어 먹통이 될 수 없다.
let pending=null;
function commit(){
  if(!pending) return;
  const dir=pending.dir; clearTimeout(pending.timer);
  cur=((cur+dir)%n+n)%n; pending=null;
  // 화면에 들어온 장이 그대로 가운데가 되게 DOM 을 회전 — 가운데 src 를 갈아끼우면
  // 새 그림이 디코딩되기 전 한 프레임 동안 이전 그림이 비친다.
  if(dir===1){ track.appendChild(track.firstElementChild); slides.push(slides.shift()); }
  if(dir===-1){ track.prepend(track.lastElementChild); slides.unshift(slides.pop()); }
  slides.forEach(s=>s.classList.remove('pop'));
  show(); setY(0,false);
}

const buzz=(ms=4)=>navigator.vibrate?.(ms);

// 확정은 transitionend 가 아니라 타이머로 — transitionend 는 유실될 수 있다
function slideTo(dir){
  if(!n) return;
  commit();
  if(!dir || n<2){ setY(0,true); return; }
  buzz();
  track.style.transition=EASE;
  track.style.transform=`translateY(${-100-dir*100}%)`;
  setFade(dir>0?[DIM,DIM,1]:[1,DIM,DIM], true);
  pending={dir, timer:setTimeout(commit,720)};
}

let pageY=0;
const lockPage=()=>{ pageY=scrollY; document.documentElement.classList.add('locked'); };
const unlockPage=()=>{ document.documentElement.classList.remove('locked'); scrollTo(0,pageY); };
const isOpen=()=>viewer.classList.contains('open');
const closeViewer=()=>{ unlockPage(); viewer.classList.remove('open');
  const m=mediaOf(1); if(m?.tagName==='VIDEO') m.pause(); };

function openAt(i){
  buzz(); commit(); lockPage();
  cur=i; show(); setY(0,false);
  slides[1].classList.add('pop');
  viewer.classList.add('open');
}
document.querySelectorAll('[data-full]').forEach((el,i)=>el.addEventListener('click',()=>openAt(i)));

// iOS 필수 한 줄: 문서 레벨 터치 리스너가 있어야 요소들에 터치가 제대로 전달된다
document.addEventListener('touchstart',()=>{},{passive:true});

// 핀치 확대 — 가운데 장에 transform 하나만 얹는다
let zoom=1, zx=0, zy=0, pinch=null, panX0=0, panY0=0, justPinched=false;
function applyZoom(animate){
  const m=mediaOf(1); if(!m) return;
  m.style.transition=animate?'transform .25s ease':'none';
  m.style.transform=zoom>1?`translate(${zx}px, ${zy}px) scale(${zoom})`:'';
}
function resetZoom(animate){ zoom=1; zx=zy=0; pinch=null; applyZoom(animate); }
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);

let tx=0, ty=0, tdy=0, tdrag=false;
track.addEventListener('touchstart',e=>{
  if(e.touches.length>=2){
    pinch={ d0:dist(e.touches), z0:zoom,
            x0:(e.touches[0].clientX+e.touches[1].clientX)/2,
            y0:(e.touches[0].clientY+e.touches[1].clientY)/2, zx0:zx, zy0:zy };
    tdrag=false; return;
  }
  commit();
  tx=e.touches[0].clientX; ty=e.touches[0].clientY;
  panX0=zx; panY0=zy; tdy=0; tdrag=false;
  track.style.transition='none';
},{passive:true});
track.addEventListener('touchmove',e=>{
  if(pinch && e.touches.length>=2){
    e.preventDefault();
    zoom=Math.min(5,Math.max(1, pinch.z0*dist(e.touches)/pinch.d0));
    zx=pinch.zx0+(e.touches[0].clientX+e.touches[1].clientX)/2-pinch.x0;
    zy=pinch.zy0+(e.touches[0].clientY+e.touches[1].clientY)/2-pinch.y0;
    applyZoom(false); return;
  }
  if(zoom>1){                       // 확대 중 한 손가락 = 패닝
    e.preventDefault();
    zx=panX0+e.touches[0].clientX-tx; zy=panY0+e.touches[0].clientY-ty;
    applyZoom(false); return;
  }
  tdy=e.touches[0].clientY-ty;
  if(!tdrag && Math.abs(tdy)>6) tdrag=true;   // 탭과 섞이지 않게 6px 문턱
  if(tdrag){ e.preventDefault(); setY(tdy,false); }
},{passive:false});
// 화면 높이의 18%(데스크톱 110px 상한)만 밀어도 넘어간다
const THRESHOLD=()=>Math.min(110, innerHeight*.18);
track.addEventListener('touchend',e=>{
  if(pinch){
    justPinched=true;
    if(zoom<=1.05) resetZoom(true);
    pinch=null;
    if(e.touches.length===1){ tx=e.touches[0].clientX; ty=e.touches[0].clientY;
                              panX0=zx; panY0=zy; }
    return;
  }
  if(zoom>1) return;
  if(!tdrag) return;                // 탭은 click 핸들러가 닫기로 처리
  slideTo(Math.abs(tdy)>THRESHOLD()?(tdy<0?1:-1):0);
},{passive:true});
track.addEventListener('touchcancel',()=>{ pinch=null; if(tdrag) slideTo(0); },{passive:true});

// 데스크톱 마우스 드래그
let my=0, mdy=0, mdown=false, mdrag=false;
track.addEventListener('mousedown',e=>{
  if(e.button) return;
  commit(); mdown=true; mdrag=false; mdy=0; my=e.clientY;
  track.style.transition='none'; e.preventDefault();
});
addEventListener('mousemove',e=>{
  if(!mdown) return;
  mdy=e.clientY-my;
  if(!mdrag && Math.abs(mdy)>6) mdrag=true;
  if(mdrag) setY(mdy,false);
});
addEventListener('mouseup',()=>{
  if(!mdown) return;
  mdown=false;
  if(mdrag) slideTo(Math.abs(mdy)>THRESHOLD()?(mdy<0?1:-1):0);
});

// 탭/클릭(드래그·핀치가 아니었을 때만) → 확대 중이면 원래 크기로, 아니면 닫기
track.addEventListener('click',e=>{
  if(tdrag||mdrag||justPinched){ tdrag=mdrag=justPinched=false; return; }
  if(e.target.tagName==='VIDEO') return;   // 영상 컨트롤 조작은 그대로 통과
  buzz();
  if(zoom>1){ resetZoom(true); return; }
  closeViewer();
});

// 트랙패드 두 손가락 스와이프 — 관성 이벤트가 계속 오므로 제스처당 한 번만
let wheelLock=false, wheelT=0;
track.addEventListener('wheel',e=>{
  if(e.ctrlKey){                    // 트랙패드 핀치
    e.preventDefault();
    zoom=Math.min(5,Math.max(1, zoom-e.deltaY*.02));
    if(zoom===1) zx=zy=0;
    applyZoom(false); return;
  }
  e.preventDefault();
  clearTimeout(wheelT); wheelT=setTimeout(()=>{ wheelLock=false; },250);
  if(wheelLock || Math.abs(e.deltaY)<25) return;
  wheelLock=true;
  slideTo(e.deltaY>0?1:-1);
},{passive:false});

document.onkeydown=e=>{
  if(!isOpen()) return;
  if(e.key==='Escape'){ closeViewer(); return; }
  const dir={ArrowUp:-1, ArrowLeft:-1, ArrowDown:1, ArrowRight:1}[e.key];
  if(dir) slideTo(dir);
};
</script>
</body></html>
