<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<style>
:root{--bg:#faf9f7;--fg:#1a1a19;--muted:#6b6a66;--line:#e2e0db;--card:#fff;--accent:#2f6f4f}
@media(prefers-color-scheme:dark){:root{--bg:#131311;--fg:#eceae5;--muted:#9a978f;--line:#2b2a27;--card:#1b1b19;--accent:#7fc0a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
a{color:inherit;text-decoration:none}
header{padding:clamp(2rem,5vw,3.5rem) 1.5rem 1.5rem;border-bottom:1px solid var(--line)}
.wrap{max-width:1400px;margin:0 auto}
h1{margin:0;font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:.5rem}
main{padding:1.75rem 1.5rem 5rem}
.years{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
/* 학기 카드: 이름을 아래 상자에 따로 두지 않고 썸네일 위에 얹는다 */
.card{position:relative;border-radius:12px;overflow:hidden;display:block;
  transition:transform .15s ease}
.card:hover{transform:translateY(-2px)}
.card .thumb{aspect-ratio:4/3;background:var(--line) center/cover no-repeat;display:block}
.card .meta{position:absolute;inset:auto 0 0 0;padding:1.6rem .8rem .6rem;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.72))}
.card .meta b{font-size:1.15rem;letter-spacing:-.01em}
.card .meta span{display:block;font-size:.8rem;opacity:.8;margin-top:.1rem}
h2{margin:2rem 0 .2rem;font-size:1.1rem;letter-spacing:-.01em}
h2:first-of-type{margin-top:.25rem}
.path{color:var(--muted);font-size:.85rem;margin-bottom:.9rem}
/* 한 사람 작업을 한 그룹으로 묶으면서 한 그룹에 100장 넘는 경우가 생겼다.
   타일을 작게 잡아 한 화면에 많이 들어오게 한다 (자세히 볼 땐 라이트박스). */
.grid{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.grid img,.grid video{width:100%;height:100%;object-fit:cover;display:block;
  aspect-ratio:1;background:var(--line);border-radius:8px;cursor:zoom-in}
.tile{position:relative;display:block;aspect-ratio:1}
.tile video{cursor:pointer}
.badge{position:absolute;left:.45rem;bottom:.45rem;pointer-events:none;
  display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .5rem;border-radius:999px;
  background:rgba(0,0,0,.66);color:#fff;font-size:.72rem;line-height:1;
  backdrop-filter:blur(2px)}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.28) 0 34px,transparent 34px)}
.tile .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:1.6rem;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.doc{display:flex;align-items:center;gap:.5rem;padding:.9rem;border:1px dashed var(--line);border-radius:8px}
.back{display:inline-block;margin-bottom:1rem;color:var(--muted);font-size:.9rem}
.back:hover{color:var(--accent)}
/* 확대 화면은 테두리 없이 화면 전체를 쓴다 */
dialog{border:0;padding:0;margin:0;background:transparent;
  width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;
  overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(0,0,0,.94)}
#lbbody{min-height:100dvh;display:flex;align-items:center;justify-content:center}
#lbbody.zoomed{align-items:flex-start}
dialog img,dialog video{max-width:100vw;max-height:100dvh;width:auto;height:auto;
  display:block;border-radius:0}
/* 기본은 한 화면에 다 들어오게. 자세히 볼 땐 눌러서 원래 폭으로 확대. */
dialog img{cursor:zoom-in}
dialog img.zoom{max-width:none;max-height:none;width:100vw;cursor:zoom-out}
footer{border-top:1px solid var(--line);padding:2rem 1.5rem;color:var(--muted);font-size:.85rem}

<dialog id="lb"><div id="lbbody"></div></dialog>
<script>
const lb=document.getElementById('lb'), body=document.getElementById('lbbody');
const items=[...document.querySelectorAll('[data-full]')];
let idx=0;

function show(i){
  idx=(i+items.length)%items.length;
  const el=items[idx];
  body.className='';
  body.innerHTML = el.dataset.kind==='video'
    ? '<video controls autoplay playsinline src="'+el.dataset.full+'"></video>'
    : '<img src="'+el.dataset.full+'" alt="">';
}
items.forEach((el,i)=>el.addEventListener('click',()=>{ show(i); lb.showModal(); }));

// 이미지 누르면 원래 폭으로 확대/축소, 빈 곳 누르면 닫기
body.addEventListener('click',e=>{
  if(e.target.tagName==='IMG'){
    e.stopPropagation();
    e.target.classList.toggle('zoom');
    body.classList.toggle('zoomed');
  } else if(e.target===body){ lb.close(); }
});
lb.addEventListener('click',e=>{ if(e.target===lb) lb.close(); });
lb.addEventListener('close',()=>{ body.innerHTML=''; });

// 위아래 스와이프로 앞뒤 이동 (확대 상태에선 스크롤이 우선)
let y0=null;
lb.addEventListener('touchstart',e=>{
  y0 = body.querySelector('.zoom') ? null : e.touches[0].clientY;
},{passive:true});
lb.addEventListener('touchend',e=>{
  if(y0===null) return;
  const dy=e.changedTouches[0].clientY-y0; y0=null;
  if(Math.abs(dy)>60) show(idx + (dy<0 ? 1 : -1));
},{passive:true});

// 키보드도 같은 방향으로
addEventListener('keydown',e=>{
  if(!lb.open) return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight') show(idx+1);
  if(e.key==='ArrowUp'||e.key==='ArrowLeft') show(idx-1);
});
</script>
